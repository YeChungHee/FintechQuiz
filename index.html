<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>핀테크 도메인 O/X 퀴즈 | 276홀딩스</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── 전역 ──────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#f0ebf8;
  font-family:'Roboto','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  color:#202124;
  min-height:100vh;
  padding:0 0 60px;
}

/* ── 상단 보라색 헤더 바 ────────────────────────────────────── */
.top-bar{
  height:10px;
  background:linear-gradient(90deg,#673AB7,#9C27B0,#E91E8C);
}

/* ── 폼 컨테이너 ───────────────────────────────────────────── */
.form-wrap{
  max-width:720px;
  margin:0 auto;
  padding:0 16px;
}

/* ── 폼 헤더 카드 ──────────────────────────────────────────── */
.form-header{
  background:white;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
  margin:24px 0 12px;
}
.form-header-accent{
  height:10px;
  background:linear-gradient(90deg,#673AB7,#9C27B0);
}
.form-header-body{padding:24px 28px 28px;}
.form-title{
  font-size:28px;
  font-weight:400;
  color:#202124;
  margin-bottom:10px;
  font-family:'Google Sans','Roboto',sans-serif;
}
.form-desc{font-size:14px;color:#444;line-height:1.6;}
.form-meta{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid #f0f0f0;
  font-size:13px;
  color:#888;
}
.required-note{
  font-size:13px;
  color:#d93025;
  margin:0 0 4px;
}

/* ── 성명 입력 카드 ─────────────────────────────────────────── */
.name-card{
  background:white;
  border-radius:8px;
  padding:22px 28px;
  box-shadow:0 2px 6px rgba(0,0,0,.10);
  margin-bottom:12px;
  border-top:3px solid #673AB7;
}
.name-label{font-size:15px;color:#202124;margin-bottom:12px;display:block;}
.name-label .req{color:#d93025;}
.name-input{
  width:100%;
  border:none;
  border-bottom:2px solid #dadce0;
  padding:8px 0;
  font-size:15px;
  font-family:inherit;
  color:#202124;
  outline:none;
  transition:border-color .2s;
  background:transparent;
}
.name-input:focus{border-bottom-color:#673AB7;}
.name-input::placeholder{color:#bbb;}

/* ── 섹션 제목 카드 ─────────────────────────────────────────── */
.section-card{
  background:white;
  border-radius:8px;
  padding:18px 28px;
  box-shadow:0 2px 6px rgba(0,0,0,.10);
  margin-bottom:12px;
  border-left:5px solid #673AB7;
}
.section-label{font-size:16px;font-weight:500;color:#673AB7;}
.section-desc{font-size:13px;color:#666;margin-top:4px;}

/* ── 문항 카드 ──────────────────────────────────────────────── */
.q-card{
  background:white;
  border-radius:8px;
  padding:22px 28px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
  margin-bottom:10px;
  transition:box-shadow .2s;
}
.q-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.13);}
.q-card.error-border{border:2px solid #d93025;}

/* 문항 번호 + 텍스트 */
.q-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px;}
.q-num{
  min-width:28px;height:28px;
  background:#673AB7;color:white;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:500;
  flex-shrink:0;margin-top:1px;
}
.q-text{font-size:15px;line-height:1.65;color:#202124;}
.q-cat{
  display:inline-block;
  font-size:11px;padding:2px 9px;border-radius:4px;
  font-weight:500;margin-bottom:6px;
}
.cat-기초{background:#e8eaf6;color:#3949ab;}
.cat-어음{background:#e0f7fa;color:#00838f;}
.cat-팩토링{background:#fce4ec;color:#c62828;}
.cat-플로우페이{background:#e8f5e9;color:#2e7d32;}
.cat-규제{background:#fff3e0;color:#e65100;}
.cat-응용{background:#f3e5f5;color:#7b1fa2;}

/* O/X 라디오 버튼 (구글 폼 스타일) */
.ox-group{display:flex;flex-direction:column;gap:4px;}
.ox-option{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;border-radius:6px;
  cursor:pointer;
  transition:background .15s;
  user-select:none;
}
.ox-option:hover{background:#f8f0ff;}
.ox-option input[type=radio]{
  width:18px;height:18px;
  accent-color:#673AB7;
  cursor:pointer;
  flex-shrink:0;
}
.ox-option-label{font-size:15px;color:#202124;}

/* 피드백 (채점 후) */
.q-feedback{
  display:none;
  margin-top:14px;
  padding:12px 14px;
  border-radius:6px;
  font-size:13.5px;
  line-height:1.6;
}
.q-feedback.show{display:block;}
.q-feedback.ok{background:#e8f5e9;border-left:4px solid #34a853;color:#1e7e34;}
.q-feedback.ng{background:#fce8e6;border-left:4px solid #d93025;color:#9a0007;}

/* ── 제출 영역 ──────────────────────────────────────────────── */
.submit-area{
  display:flex;align-items:center;gap:20px;
  margin:20px 0 32px;
  flex-wrap:wrap;
}
.btn-submit{
  background:#673AB7;color:white;
  border:none;padding:12px 32px;
  font-size:15px;font-weight:500;font-family:inherit;
  border-radius:4px;cursor:pointer;
  box-shadow:0 2px 5px rgba(103,58,183,.35);
  transition:all .18s;
}
.btn-submit:hover:not(:disabled){background:#5e35b1;box-shadow:0 3px 8px rgba(103,58,183,.45);}
.btn-submit:disabled{background:#c5c5c5;box-shadow:none;cursor:not-allowed;}
.btn-clear{
  background:transparent;color:#673AB7;
  border:none;font-size:14px;font-family:inherit;
  cursor:pointer;padding:8px 4px;
  text-decoration:underline;
  text-underline-offset:3px;
}

/* ── 결과 페이지 ────────────────────────────────────────────── */
#result-section{display:none;}

.result-header{
  background:white;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
  margin:24px 0 12px;
}
.result-header-accent{height:10px;background:linear-gradient(90deg,#673AB7,#9C27B0);}
.result-header-body{padding:28px 28px 24px;}
.result-name{font-size:14px;color:#666;margin-bottom:4px;}
.result-title{font-size:26px;font-weight:400;color:#202124;margin-bottom:16px;font-family:'Google Sans','Roboto',sans-serif;}

/* 점수 게이지 */
.score-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:16px;}
.score-circle{
  width:88px;height:88px;border-radius:50%;
  background:conic-gradient(var(--pct-color,#673AB7) calc(var(--pct,0)*1%*3.6deg), #e8e0f7 0);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.score-circle-inner{
  width:68px;height:68px;background:white;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.score-big{font-size:22px;font-weight:700;color:#673AB7;line-height:1;}
.score-denom{font-size:12px;color:#888;}
.score-info{}
.score-pct{font-size:28px;font-weight:700;color:#202124;}
.score-grade{display:inline-block;padding:4px 14px;border-radius:99px;font-size:13px;font-weight:500;margin-top:4px;}
.grade-A{background:#e8f5e9;color:#2e7d32;}
.grade-B{background:#e3f2fd;color:#1565c0;}
.grade-C{background:#fff8e1;color:#f57f17;}
.grade-D{background:#fce4ec;color:#c62828;}
.score-comment{font-size:14px;color:#444;line-height:1.55;margin-top:12px;}

/* 결과 테이블 카드 */
.result-table-card{
  background:white;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,.10);
  margin-bottom:12px;
  overflow:hidden;
}
.result-table-title{
  padding:16px 24px 14px;
  font-size:15px;font-weight:500;color:#673AB7;
  border-bottom:1px solid #f0ebf8;
  background:#faf5ff;
}
table.result-tbl{width:100%;border-collapse:collapse;}
table.result-tbl th{
  background:#f5f0fc;
  font-size:13px;font-weight:500;color:#5a3fa0;
  padding:10px 14px;
  text-align:left;
  border-bottom:2px solid #e8e0f7;
}
table.result-tbl td{
  font-size:13.5px;padding:11px 14px;
  border-bottom:1px solid #f5f0f8;
  vertical-align:top;
  color:#202124;
  line-height:1.5;
}
table.result-tbl tr:last-child td{border-bottom:none;}
table.result-tbl tr.row-ok td{background:#f9fffe;}
table.result-tbl tr.row-ng td{background:#fff9f9;}
.tag-ok{display:inline-block;background:#e8f5e9;color:#2e7d32;font-weight:600;padding:3px 12px;border-radius:4px;font-size:12px;}
.tag-ng{display:inline-block;background:#fce8e6;color:#d93025;font-weight:600;padding:3px 12px;border-radius:4px;font-size:12px;}
.ans-correct{color:#1e7e34;font-weight:500;}
.ans-wrong{color:#d93025;font-weight:500;}

/* 다시 풀기 버튼 영역 */
.retry-area{display:flex;gap:12px;margin:16px 0 32px;flex-wrap:wrap;}
.btn-retry{
  background:#673AB7;color:white;border:none;
  padding:11px 28px;font-size:14px;font-weight:500;
  font-family:inherit;border-radius:4px;cursor:pointer;
  transition:background .18s;
}
.btn-retry:hover{background:#5e35b1;}
.btn-print{
  background:white;color:#673AB7;
  border:2px solid #673AB7;
  padding:11px 28px;font-size:14px;font-weight:500;
  font-family:inherit;border-radius:4px;cursor:pointer;
  transition:all .18s;
}
.btn-print:hover{background:#f8f0ff;}

/* 오류 메시지 */
.err-msg{font-size:12px;color:#d93025;margin-top:4px;display:none;}
.err-msg.show{display:block;}

/* ── 반응형 ─────────────────────────────────────────────────── */
@media(max-width:600px){
  .form-header-body,.name-card,.q-card{padding:18px 16px;}
  .form-title{font-size:22px;}
  table.result-tbl th,table.result-tbl td{padding:8px 10px;font-size:12.5px;}
}

@media print{
  body{background:white;padding:0;}
  .top-bar,.submit-area,.retry-area,.btn-print{display:none!important;}
  #quiz-section{display:none!important;}
  #result-section{display:block!important;}
  .result-table-card,.result-header{box-shadow:none;border:1px solid #ddd;}
}
</style>
</head>
<body>
<div class="top-bar"></div>

<!-- ══════════════════ 퀴즈 섹션 ══════════════════ -->
<div class="form-wrap" id="quiz-section">

  <!-- 헤더 카드 -->
  <div class="form-header">
    <div class="form-header-accent"></div>
    <div class="form-header-body">
      <div class="form-title">&#x1F4CA; 핀테크 도메인 O/X 퀴즈</div>
      <div class="form-desc">276홀딩스 영업지원팀 신입사원 온보딩 교육 자가 점검<br>교육자료(핀테크_도메인_교육자료.docx)를 정독한 후 풀어보세요.</div>
      <div class="form-meta">총 30문항 &nbsp;·&nbsp; 5개 카테고리 &nbsp;·&nbsp; 문항당 1점</div>
    </div>
  </div>

  <!-- 성명 카드 -->
  <div class="name-card">
    <label class="name-label" for="inputName">성명 <span class="req">*</span></label>
    <input type="text" id="inputName" class="name-input" placeholder="이름을 입력하세요" autocomplete="off">
    <div class="err-msg" id="nameErr">성명을 입력해 주세요.</div>
  </div>

  <!-- 문항 카드들 (JS가 렌더링) -->
  <div id="quiz-container"></div>

  <!-- 제출 -->
  <div class="submit-area">
    <button class="btn-submit" id="submitBtn" onclick="submitQuiz()">채점하기</button>
    <button class="btn-clear" onclick="clearAll()">응답 지우기</button>
  </div>
</div>

<!-- ══════════════════ 결과 섹션 ══════════════════ -->
<div class="form-wrap" id="result-section">

  <div class="result-header">
    <div class="result-header-accent"></div>
    <div class="result-header-body">
      <div class="result-name" id="res-name"></div>
      <div class="result-title">&#x2705; 채점 결과</div>
      <div class="score-row">
        <div class="score-circle" id="scoreCircle">
          <div class="score-circle-inner">
            <span class="score-big" id="scoreNum">0</span>
            <span class="score-denom" id="scoreDenom">/30</span>
          </div>
        </div>
        <div class="score-info">
          <div class="score-pct" id="scorePct">0%</div>
          <div><span class="score-grade" id="scoreGrade"></span></div>
        </div>
      </div>
      <div class="score-comment" id="scoreComment"></div>
    </div>
  </div>

  <!-- 결과 테이블 -->
  <div class="result-table-card">
    <div class="result-table-title">&#x1F4CB; 문항별 답변 내역</div>
    <div style="overflow-x:auto;">
      <table class="result-tbl" id="resultTable">
        <thead>
          <tr>
            <th style="width:46px;">번호</th>
            <th>문항</th>
            <th style="width:68px;">내 답변</th>
            <th style="width:68px;">정답</th>
            <th style="width:72px;">결과</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>

  <div class="retry-area">
    <button class="btn-retry" onclick="retryQuiz()">&#x1F504; 다시 풀기</button>
    <button class="btn-print" onclick="window.print()">&#x1F5A8; 결과 인쇄</button>
  </div>
</div>

<script>
/* ═══════════════ 문항 데이터 (30문항) ═══════════════ */
// ── Google Sheets 연동 ──────────────────────────────────────────
// Apps Script 배포 후 아래 URL을 교체하세요
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwVv93ic_VlKwnQvm2wUYHtNX44AbYBJCH2XiSJRMiWjoY892NCKftniF5ufUgv2B7s/exec';

var Q = [
  // ── 기초 (8문항) ─────────────────────────────────────────
  {c:'기초', q:'핀테크(FinTech)는 Financial(금융)과 Technology(기술)의 합성어이다.', a:'O', ex:'핀테크 = Financial + Technology. IT 기술을 활용한 금융 서비스 혁신 산업 전반을 뜻합니다.'},
  {c:'기초', q:'핀테크 산업에서 InsurTech는 보험(Insurance)에 기술을 접목한 서비스를 의미한다.', a:'O', ex:'InsurTech = Insurance + Technology. AI·빅데이터를 활용한 보험 혁신 서비스입니다.'},
  {c:'기초', q:'BNPL(Buy Now Pay Later)은 B2B 기업 간 거래를 위한 금융 서비스이다.', a:'X', ex:'BNPL은 B2C(기업→소비자) 서비스입니다. B2B에 해당하는 것은 SNPL입니다.'},
  {c:'기초', q:'SNPL(Supply Now Pay Later)은 B2B 기업 간 구매대행 후불결제 서비스이다.', a:'O', ex:'SNPL = Supply Now Pay Later. 기업이 물품을 먼저 수령하고 나중에 납부하는 B2B 구조입니다.'},
  {c:'기초', q:'공급망금융(SCF)에서 구매기업의 신용을 기반으로 공급업체에 자금이 제공된다.', a:'O', ex:'신용이 높은 구매기업(바이어)의 신용을 활용해 공급업체가 조기 현금을 수령하는 구조입니다.'},
  {c:'기초', q:'오픈뱅킹 정책은 핀테크 기업의 성장을 저해하는 규제이다.', a:'X', ex:'오픈뱅킹은 은행 API를 핀테크 기업에 개방하는 정책으로, 오히려 핀테크 산업 성장을 촉진합니다.'},
  {c:'기초', q:'P2P 금융은 중개기관 없이 개인 간 직접 대출·투자하는 방식이다.', a:'O', ex:'P2P(Peer-to-Peer) 금융은 플랫폼을 통해 개인이 다른 개인에게 직접 투자·대출하는 방식입니다.'},
  {c:'기초', q:'핀테크 기업은 반드시 금융 면허(은행업 인가)를 취득해야만 서비스를 제공할 수 있다.', a:'X', ex:'핀테크 기업은 제공하는 서비스 유형에 따라 필요한 인허가가 다릅니다. 결제·데이터 등 일부는 은행업 인가 없이도 가능합니다.'},

  // ── 전자어음 (6문항) ────────────────────────────────────
  {c:'어음', q:'전자어음은 종이 어음과 달리 분실·위조 위험이 낮다.', a:'O', ex:'금융결제원을 통해 전자적으로 관리되어 종이 어음의 분실·위조 문제가 해소됩니다.'},
  {c:'어음', q:'전자어음의 통상 만기는 30일에서 120일이다.', a:'X', ex:'현행 전자어음의 최대 만기는 90일입니다. 120일은 잘못된 정보이며, 정확히는 30일~90일 범위 내에서 운영됩니다.'},
  {c:'어음', q:'전자어음의 발행·유통을 관리하는 전자어음관리기관은 금융결제원이다.', a:'O', ex:'금융결제원이 전자어음관리기관으로서 발행·유통·소각을 관리합니다.'},
  {c:'어음', q:'어음할인이란 만기가 지난 어음을 현금으로 교환하는 방식이다.', a:'X', ex:'어음할인은 만기 전 어음을 할인하여 현금화하는 방식입니다. 만기 후에는 그냥 대금을 청구하면 됩니다.'},
  {c:'어음', q:'어음할인율이 높을수록 공급업체가 수령하는 금액이 많아진다.', a:'X', ex:'할인율이 높을수록 차감액이 커져 수령금액이 줄어듭니다.\n수령금액 = 액면가 × (1 − 할인율 × 잔존일수/365)'},
  {c:'어음', q:'전자어음은 분할 양도가 불가능하다.', a:'X', ex:'전자어음은 분할 양도가 가능합니다. 이는 종이 어음 대비 유연한 특징 중 하나입니다.'},

  // ── 팩토링·외담대 (8문항) ──────────────────────────────
  {c:'팩토링', q:'팩토링의 법적 근거는 어음법이다.', a:'X', ex:'팩토링은 민법의 채권양도 규정을 근거로 합니다. 어음법은 어음할인의 근거입니다.'},
  {c:'팩토링', q:'상환청구권 無(Non-Recourse) 팩토링에서 채무 불이행 리스크는 금융기관이 부담한다.', a:'O', ex:'Non-Recourse 팩토링은 채무 불이행 시 금융기관이 공급업체(매도인)에게 상환 청구 불가 — 리스크를 금융기관이 부담합니다.'},
  {c:'팩토링', q:'팩토링에서 채권을 매각하면 회계상 해당 채권이 재무상태표에서 제거된다.', a:'O', ex:'팩토링은 채권 매각이므로 재무상태표에서 채권이 제거되고 현금(수취액)이 증가합니다.'},
  {c:'팩토링', q:'외담대(외상매출채권담보대출)는 채권 소유권을 금융기관에 이전하는 방식이다.', a:'X', ex:'외담대는 채권을 담보로 제공할 뿐 소유권은 기업이 보유합니다. 소유권이 이전되는 것은 팩토링입니다.'},
  {c:'팩토링', q:'팩토링과 외담대의 가장 큰 차이는 채권 소유권의 이전 여부이다.', a:'O', ex:'팩토링(매각→소유권 이전) vs 외담대(담보 제공→소유권 유지)가 핵심 차이입니다.'},
  {c:'팩토링', q:'배서(背書)란 어음·수표의 뒷면에 서명하여 제3자에게 권리를 양도하는 행위이다.', a:'O', ex:'어음 배서는 뒷면에 서명하여 권리를 제3자에게 넘기는 행위로, 어음할인 시 활용됩니다.'},
  {c:'팩토링', q:'상환청구권 有(Recourse) 팩토링에서 채무 불이행 시 금융기관은 채무자에게만 청구할 수 있다.', a:'X', ex:'Recourse 팩토링은 채무 불이행 시 금융기관이 채무자뿐 아니라 매도인(공급업체)에게도 상환을 청구할 수 있습니다.'},
  {c:'팩토링', q:'외담대 방식에서는 채권 소유권이 기업에 남아 있으므로 회계상 부채(차입금)가 계상된다.', a:'O', ex:'외담대는 대출 방식이므로 채권(자산)은 유지되고 차입금(부채)이 증가합니다. 팩토링과 회계 처리가 다릅니다.'},

  // ── 플로우페이 (6문항) ──────────────────────────────────
  {c:'플로우페이', q:'플로우페이는 B2C 개인 소비자를 주요 타깃으로 하는 금융 서비스이다.', a:'X', ex:'플로우페이는 B2B 서비스로, 소규모~중형 사업자(기업)를 타깃으로 합니다.'},
  {c:'플로우페이', q:'플로우페이 SNPL 구조에서 고객사는 공급사에 직접 즉시 결제한다.', a:'X', ex:'SNPL 구조에서는 플로우페이가 공급사에 먼저 결제하고, 고객사는 일정 기간 후 플로우페이에 납부합니다.'},
  {c:'플로우페이', q:'플로우페이 SNPL 구조에서 공급사는 물품 납품 후 플로우페이로부터 즉시 대금을 수령한다.', a:'O', ex:'플로우페이가 공급사에 즉시 결제하는 것이 SNPL의 핵심입니다. 공급사 입장에서 미수금 리스크가 없습니다.'},
  {c:'플로우페이', q:'플로우페이의 수익은 구매대행 수수료와 금융 마진으로 구성된다.', a:'O', ex:'플로우페이는 구매대행 수수료와 결제 유예에 따른 상품판매 마진을 수익 원천으로 합니다.'},
  {c:'플로우페이', q:'276홀딩스의 플로우페이는 B2B SNPL 카테고리의 공급망금융 서비스이다.', a:'O', ex:'플로우페이는 B2B SNPL(Supply Now Pay Later) 방식의 공급망금융(SCF) 서비스입니다.'},
  {c:'플로우페이', q:'플로우페이의 리스크 관리 핵심은 고객사 심사 프로세스이다.', a:'O', ex:'플로우페이는 고객사 미결제 리스크를 직접 부담하므로 엄격한 고객사 심사가 핵심입니다.'},

  // ── 규제·응용 (2문항) ───────────────────────────────────
  {c:'규제', q:'금융위원회는 핀테크 기업에 대한 현장 감독·검사를 담당하는 기관이다.', a:'X', ex:'현장 감독·검사는 금융감독원의 역할입니다. 금융위원회는 정책 총괄 및 혁신금융서비스(샌드박스) 심사를 담당합니다.'},
  {c:'규제', q:'혁신금융서비스(규제 샌드박스)는 신규 핀테크 서비스에 일정 기간 규제 특례를 부여한다.', a:'O', ex:'규제 샌드박스는 기존 규제에 막힌 새로운 금융 서비스에 일정 기간 특례를 주어 시장 테스트를 가능하게 하는 제도입니다.'},
];

/* ═══════════════ 상태 ═══════════════ */
var ans = new Array(Q.length).fill(null);
var submitted = false;

/* ═══════════════ 렌더링 ═══════════════ */
function render(){
  var wrap = document.getElementById('quiz-container');
  wrap.innerHTML = '';

  var curCat = '';
  Q.forEach(function(q, i){
    // 카테고리 섹션 헤더
    if(q.c !== curCat){
      curCat = q.c;
      var catCount = Q.filter(function(x){return x.c===curCat;}).length;
      var sd = document.createElement('div');
      sd.className = 'section-card';
      sd.innerHTML = '<div class="section-label">&#x1F4CC; ' + curCat + '</div>' +
        '<div class="section-desc">' + catCount + '문항</div>';
      wrap.appendChild(sd);
    }

    var card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card'+i;

    var chkO = ans[i]==='O' ? 'checked' : '';
    var chkX = ans[i]==='X' ? 'checked' : '';

    card.innerHTML =
      '<div class="q-head">' +
        '<div class="q-num">' + (i+1) + '</div>' +
        '<div><span class="q-cat cat-' + q.c + '">' + q.c + '</span><div class="q-text">' + q.q + '</div></div>' +
      '</div>' +
      '<div class="ox-group">' +
        '<label class="ox-option">' +
          '<input type="radio" name="q'+i+'" value="O" ' + chkO + ' onchange="pick('+i+',\'O\')">' +
          '<span class="ox-option-label">O &nbsp;(맞다)</span>' +
        '</label>' +
        '<label class="ox-option">' +
          '<input type="radio" name="q'+i+'" value="X" ' + chkX + ' onchange="pick('+i+',\'X\')">' +
          '<span class="ox-option-label">X &nbsp;(틀리다)</span>' +
        '</label>' +
      '</div>' +
      '<div class="err-msg" id="qerr'+i+'">답변을 선택해 주세요.</div>' +
      '<div class="q-feedback" id="fb'+i+'"></div>';

    wrap.appendChild(card);
  });
}

function pick(i, v){
  if(submitted) return;
  ans[i] = v;
  document.getElementById('qerr'+i).classList.remove('show');
  document.getElementById('card'+i).classList.remove('error-border');
}

/* ═══════════════ 제출 ═══════════════ */
function submitQuiz(){
  if(submitted) return;

  // 성명 검증
  var name = document.getElementById('inputName').value.trim();
  if(!name){
    document.getElementById('nameErr').classList.add('show');
    document.getElementById('inputName').focus();
    return;
  }
  document.getElementById('nameErr').classList.remove('show');

  // 미답변 검증
  var missing = [];
  ans.forEach(function(v,i){ if(v===null) missing.push(i); });
  if(missing.length > 0){
    missing.forEach(function(i){
      document.getElementById('card'+i).classList.add('error-border');
      document.getElementById('qerr'+i).classList.add('show');
    });
    document.getElementById('card'+missing[0]).scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  submitted = true;

  // 피드백 표시
  var correct = 0;
  Q.forEach(function(q,i){
    var ok = ans[i] === q.a;
    if(ok) correct++;
    var fb = document.getElementById('fb'+i);
    fb.className = 'q-feedback show ' + (ok?'ok':'ng');
    fb.textContent = (ok ? '✅ 정답 — ' : '❌ 오답 — 정답: ' + q.a + ' — ') + q.ex;
    // 라디오 비활성화
    document.querySelectorAll('input[name="q'+i+'"]').forEach(function(r){ r.disabled=true; });
  });

  // 점수·등급 계산 (Sheets 저장용)
  var pct   = Math.round(correct / Q.length * 100);
  var grade = pct>=90 ? 'A등급·탁월' : pct>=75 ? 'B등급·우수' : pct>=60 ? 'C등급·보통' : 'D등급·복습필요';

  // 결과 페이지 구성
  buildResult(name, correct);

  // Google Sheets 저장
  saveToSheets(name, ans.slice(), correct, pct, grade);

  // 전환
  document.getElementById('quiz-section').style.display = 'none';
  document.getElementById('result-section').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ═══════════════ 결과 페이지 ═══════════════ */
function buildResult(name, correct){
  var total = Q.length;
  var pct = Math.round(correct/total*100);

  document.getElementById('res-name').textContent = '응시자: ' + name;

  // 점수 원형 게이지 (CSS conic-gradient)
  var circle = document.getElementById('scoreCircle');
  var col = pct>=90?'#1e7e34': pct>=75?'#1565c0': pct>=60?'#f57f17':'#c62828';
  circle.style.background = 'conic-gradient('+col+' '+pct+'%, #e8e0f7 0)';

  document.getElementById('scoreNum').textContent = correct;
  document.getElementById('scoreNum').style.color = col;
  document.getElementById('scorePct').textContent = pct + '%';

  var grade, gClass, comment;
  if(pct>=90){
    grade='A등급 · 탁월'; gClass='grade-A';
    comment='훌륭합니다! 핀테크 도메인 핵심 개념을 완벽히 이해했습니다. 내일 플로우페이 심화 학습이 기대됩니다.';
  } else if(pct>=75){
    grade='B등급 · 우수'; gClass='grade-B';
    comment='잘했습니다! 대부분의 개념을 이해했습니다. 틀린 문항을 중심으로 교육자료를 한 번 더 확인해 보세요.';
  } else if(pct>=60){
    grade='C등급 · 보통'; gClass='grade-C';
    comment='기초 개념은 잡혔습니다. B2B 금융 서비스 용어(팩토링·외담대·어음할인) 파트를 추가 복습하세요.';
  } else {
    grade='D등급 · 복습 필요'; gClass='grade-D';
    comment='교육자료 3장 「B2B 금융 서비스 핵심 개념」과 4장 「플로우페이 서비스 이해」를 중심으로 다시 정독하고 재도전해 보세요.';
  }

  var el = document.getElementById('scoreGrade');
  el.textContent = grade; el.className = 'score-grade ' + gClass;
  document.getElementById('scoreComment').textContent = comment;

  // 결과 테이블
  var tbody = document.getElementById('resultBody');
  tbody.innerHTML = '';
  Q.forEach(function(q, i){
    var ok = ans[i] === q.a;
    var tr = document.createElement('tr');
    tr.className = ok ? 'row-ok' : 'row-ng';
    tr.innerHTML =
      '<td style="text-align:center;font-weight:500;">' + (i+1) + '</td>' +
      '<td>' + q.q + '</td>' +
      '<td style="text-align:center;" class="' + (ans[i]===q.a?'ans-correct':'ans-wrong') + '">' + ans[i] + '</td>' +
      '<td style="text-align:center;" class="ans-correct">' + q.a + '</td>' +
      '<td style="text-align:center;">' +
        (ok ? '<span class="tag-ok">정답</span>' : '<span class="tag-ng">오답</span>') +
      '</td>';
    tbody.appendChild(tr);
  });
}

/* ═══════════════ 다시 풀기 ═══════════════ */
function retryQuiz(){
  ans = new Array(Q.length).fill(null);
  submitted = false;
  document.getElementById('inputName').value = '';
  document.getElementById('result-section').style.display = 'none';
  document.getElementById('quiz-section').style.display = 'block';
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ═══════════════ 응답 지우기 ═══════════════ */
function clearAll(){
  if(!confirm('모든 응답을 초기화할까요?')) return;
  ans = new Array(Q.length).fill(null);
  submitted = false;
  document.getElementById('inputName').value = '';
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ═══════════════ Google Sheets 저장 ═══════════════ */
function saveToSheets(name, answers, correct, pct, grade) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL') {
    console.log('[Sheets 저장 스킵] APPS_SCRIPT_URL 미설정');
    return;
  }
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: name,
      answers: answers,
      correct: correct,
      total: Q.length,
      pct: pct,
      grade: grade
    })
  }).then(function() {
    console.log('[Sheets 저장 완료]', name, correct + '/' + Q.length);
  }).catch(function(err) {
    console.warn('[Sheets 저장 실패]', err);
  });
}

/* ═══════════════ 초기 실행 ═══════════════ */
render();
</script>
